[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# 内部 crate
uniconsole-domain = { path = "crates/domain" }
uniconsole-protocol = { path = "crates/protocol" }
uniconsole-auth = { path = "crates/auth" }

# 第三方
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
dashmap = "6.2.1"
data-encoding = "2.11.1"
dotenvy = "0.15.7"
futures = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls", "rustls-tls"] }
mcap = { version = "0.26.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
